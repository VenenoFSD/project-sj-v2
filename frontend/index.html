<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>SJ Select</title>
    <script>
      // Runs before first paint so a saved Dark Theme never flashes Light Mode.
      // Keeps DESIGN.md "Light Mode Compatibility": Light is applied when nothing is saved.
      (function () {
        var theme = 'light'
        try {
          if (window.localStorage.getItem('sj-select-theme') === 'dark') theme = 'dark'
        } catch (error) {
          theme = 'light'
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#151515' : '#ffffff')
      })()
    </script>
</head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
